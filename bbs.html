<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>掲示板 | ちぃむぐりる</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="site-title">🔥 ちぃむぐりる 🔥</h1>
    <nav>
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="blog.html">みんなの日記</a></li>
        <li><a href="gallery.html">ちぃむ画廊</a></li>
        <li><a href="bbs.html" class="active">掲示板</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>📝 みんなの掲示版</h2>
      <p>足あとや一言メッセージ、なんでも自由に書いてね！送信すると下のログに新しい順で表示されるぞ！</p>
    </section>

    <!-- 1. 投稿用Googleフォーム -->
    <section class="card">
      <h2>✍️ 書き込む</h2>
      <iframe src="ここにGoogleフォームの埋め込みURL" width="100%" height="420" frameborder="0" marginheight="0" marginwidth="0" style="border: 1px solid #e5e8ed; border-radius: 8px;">読み込んでいます…</iframe>
    </section>

    <!-- 2. JavaScriptで自動生成されるカキコ一覧エリア -->
    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eeeeee; padding-bottom: 8px; margin-bottom: 15px;">
        <h2 style="border: none; margin: 0; padding: 0;">📋 みんなのカキコ一覧</h2>
        <button onclick="loadKakiko()" style="background-color: #f0f2f5; border: 1px solid #d0d5dd; border-radius: 15px; padding: 5px 12px; cursor: pointer; font-weight: bold; font-size: 0.85em;">🔄 更新</button>
      </div>
      
      <!-- ここにJavaScriptが書き込みカードを自動生成する！ -->
      <div id="bbs-list">
        <p style="color: #888; text-align: center;">カキコを読み込み中...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ちぃむぐりる</p>
  </footer>

  <!-- ⚡ スプレッドシートのデータを掲示板デザインに変換するJavaScript -->
  <script>
    // ▼ ここに「カンマ区切り値（.csv）」の公開URLを貼る！ ▼
    const CSV_URL = "ここにスプレッドシートのCSV公開URL";

    async function loadKakiko() {
      const listArea = document.getElementById("bbs-list");
      listArea.innerHTML = '<p style="color: #888; text-align: center;">読み込み中...</p>';

      try {
        // キャッシュ対策で後ろに現在時刻をつけて最新データを取得
        const response = await fetch(CSV_URL + "&t=" + new Date().getTime());
        const csvText = await response.text();
        
        // CSVを1行ずつ分解（改行を含むメッセージにも対応）
        const rows = parseCSV(csvText);
        
        // 1行目（見出し）を除き、新しい投稿が一番上に来るように逆順にする
        const posts = rows.slice(1).reverse();

        if (posts.length === 0) {
          listArea.innerHTML = '<p style="color: #888; text-align: center;">まだカキコがありません。一番乗りしよう！</p>';
          return;
        }

        listArea.innerHTML = ""; // 表示エリアをリセット

        posts.forEach((cols, index) => {
          const time = cols[0] || "";       // 1列目：タイムスタンプ
          const name = cols[1] || "名無し"; // 2列目：お名前
          const msg  = cols[2] || "";       // 3列目：メッセージ
          const postNum = posts.length - index; // 投稿番号

          // 1件ごとのカキコ枠を作成
          const item = document.createElement("div");
          item.style.cssText = "background-color: #f9fafb; border: 1px solid #e5e8ed; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;";
          
          // HTMLタグ無効化（安全対策）＋改行反映
          const safeName = escapeHTML(name);
          const safeMsg = escapeHTML(msg).replace(/\n/g, "<br>");

          item.innerHTML = `
            <div style="font-size: 0.85em; color: #666; margin-bottom: 6px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 4px;">
              <strong style="color: #222;">[${postNum}] ${safeName}</strong>
              <span style="float: right; font-size: 0.9em;">${escapeHTML(time)}</span>
            </div>
            <div style="color: #333; line-height: 1.5; word-break: break-word;">${safeMsg}</div>
          `;
          listArea.appendChild(item);
        });
      } catch (e) {
        listArea.innerHTML = '<p style="color: #d9534f; text-align: center;">読み込みに失敗しました。CSV公開URLを確認してね！</p>';
      }
    }

    // 改行入りCSVを正しくパースする関数
    function parseCSV(text) {
      const result = [];
      let row = [], col = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') { col += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { row.push(col); col = ""; }
        else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(col); result.push(row); row = []; col = "";
        } else { col += c; }
      }
      if (col || row.length) { row.push(col); result.push(row); }
      return result;
    }

    // XSS対策（変なHTMLタグを無害化）
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // ページを開いたら自動で読み込む
    loadKakiko();
  </script>
</body>
</html>
